services:
  mongo:
    image: mongo:7
    container_name: keren-mongo
    restart: unless-stopped
    # dev-only: expose Mongo to the host so local scripts (e.g. the weekly-schedule
    # seed) can connect. Bound to 127.0.0.1 so it's reachable only from this machine,
    # never the LAN. Prod (docker-compose.prod.yml) never exposes Mongo at all.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      # initDB seed — runs once on a fresh volume to provision the baseline rows the
      # app reads DB-only (clinic settings + weekly schedule). Dev-only; prod has no
      # Mongo container (Atlas), so this never applies there.
      - ./server/migrations/init:/docker-entrypoint-initdb.d:ro
    environment:
      MONGO_INITDB_DATABASE: keren-clinic
    # rotate logs so they never fill the disk (3 files × 10MB per container)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  server:
    build: ./server
    container_name: keren-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/keren-clinic
    depends_on:
      - mongo
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  client:
    build:
      context: ./client
      args:
        # Vite build-time config — compose reads the value from the root .env
        VITE_MEDIA_BASE_URL: ${VITE_MEDIA_BASE_URL}
    container_name: keren-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mongo_data:
