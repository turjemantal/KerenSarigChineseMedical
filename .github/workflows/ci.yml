name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Server – Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm install

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Build
        working-directory: server
        run: npm run build

  client:
    name: Client – Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm install

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Build
        working-directory: client
        run: npm run build

  deploy:
    name: Deploy to production
    needs: [server, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # required for OIDC
      contents: read
    concurrency:         # never run two prod deploys at once
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      # ── Pre-flight: render + validate prod .env BEFORE building or touching prod ──
      # A missing/invalid required var fails the deploy here, while prod stays on the
      # last working version — instead of crash-looping live (server exits on bad env).
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Render prod .env from secret
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: printf '%s' "$PROD_ENV_FILE" > env.prod

      - name: Validate prod .env (pre-flight)
        working-directory: server
        run: |
          npm ci
          npm run validate:env -- ../env.prod

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/keren-server:latest
            ${{ steps.ecr.outputs.registry }}/keren-server:${{ github.sha }}

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_MEDIA_BASE_URL=${{ vars.VITE_MEDIA_BASE_URL }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/keren-client:latest
            ${{ steps.ecr.outputs.registry }}/keren-client:${{ github.sha }}

      - name: Sync .env + config files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # all four are repo-root files → land directly in /home/ubuntu
          source: "docker-compose.prod.yml,nginx.conf,vector.yaml,env.prod"
          target: "/home/ubuntu"

      - name: Pull images & restart stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mv ~/env.prod ~/.env          # atomically replace prod .env
            chmod 600 ~/.env              # owner-only — it holds all prod secrets
            aws ecr get-login-password --region eu-central-1 \
              | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
